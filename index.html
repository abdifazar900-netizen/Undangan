<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membuka Undangan Pernikahan...</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="text-center space-y-4">
    <div class="w-16 h-16 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
    <div class="space-y-1">
      <h2 class="text-lg font-bold text-white">Menyiapkan Undangan...</h2>
      <p class="text-xs text-slate-400">Mohon tunggu sebentar, sedang memuat tema pilihan.</p>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzil42IARd7zFttb8RtxWEJf7CrcZFtm-hDUJCHPr1GqImwa2Ogb0FqCCs-6gaA4q93Xw/exec";

    // Peta Pengarahan File Tema (Sesuai Value Radio di Dashboard)
    const THEME_MAP = {
      "jawa": "tema-jawa.html",
      "sunda": "tema-sunda.html",
      "melayu": "tema-melayu.html",
      "betawi": "tema-betawi.html",
      "bugis": "tema-bugis.html",
      "minang": "tema-minang.html",
      "floral": "tema-floral.html",
      "gold": "tema-gold.html",
      "dark": "tema-dark.html",
      "islamic": "tema-islamic.html"
    };

    async function routeToTheme() {
      const urlParams = new URLSearchParams(window.location.search);
      const namaTamu = urlParams.get('to') || '';

      try {
        const res = await fetch(SCRIPT_URL + "?action=getSettings");
        const json = await res.json();
        
        let selectedTheme = "floral"; // Default jika tidak ada tema tersimpan

        if (json.status === "success" && json.data && json.data.tema) {
          selectedTheme = json.data.tema;
        }

        // Cari target file HTML berdasarkan tema
        const targetHtml = THEME_MAP[selectedTheme] || "tema-floral.html";
        const redirectUrl = `${targetHtml}?to=${encodeURIComponent(namaTamu)}`;

        // Eksekusi Redirect Otomatis
        window.location.replace(redirectUrl);

      } catch (err) {
        console.error("Gagal membaca tema, menggunakan tema default:", err);
        window.location.replace(`tema-floral.html?to=${encodeURIComponent(namaTamu)}`);
      }
    }

    window.onload = routeToTheme;
  </script>
</body>
</html>
