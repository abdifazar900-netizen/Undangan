<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Pernikahan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-3xl p-8 text-center space-y-6 border border-slate-700 shadow-2xl">
    
    <div class="space-y-2">
      <p class="text-xs uppercase tracking-widest text-indigo-400 font-semibold">The Wedding Of</p>
      <h1 class="text-3xl font-serif font-bold text-amber-200">Fazar & Gita</h1>
    </div>

    <!-- AREA NAMA TAMU DINAMIS -->
    <div class="bg-slate-900/80 p-6 rounded-2xl border border-slate-700 space-y-2">
      <p class="text-xs text-slate-400">Kepada Yth. Bapak/Ibu/Saudara/i:</p>
      <h2 id="penerimaTamu" class="text-xl font-bold text-white">Tamu Undangan</h2>
      <p class="text-xs text-slate-500 italic">Tanpa mengurangi rasa hormat, kami mengundang Anda untuk hadir di acara pernikahan kami.</p>
    </div>

    <div class="space-y-3 pt-4">
      <div class="flex items-center justify-center gap-2 text-sm text-slate-300">
        <i class="fa-regular fa-calendar text-indigo-400"></i>
        <span>Sabtu, 24 Oktober 2026</span>
      </div>
      <div class="flex items-center justify-center gap-2 text-sm text-slate-300">
        <i class="fa-solid fa-location-dot text-indigo-400"></i>
        <span>Gedung Pernikahan Utama</span>
      </div>
    </div>

    <!-- FORM RSVP UNTUK TAMU -->
    <form id="rsvpForm" onsubmit="kirimRSVP(event)" class="space-y-3 pt-4 border-t border-slate-700 text-left">
      <h3 class="text-sm font-semibold text-white">Konfirmasi Kehadiran</h3>
      
      <select id="rsvpStatus" class="w-full bg-slate-900 border border-slate-700 text-xs rounded-xl px-3 py-2 text-slate-200">
        <option value="Hadir">Saya Akan Hadir</option>
        <option value="Tidak Hadir">Maaf, Tidak Bisa Hadir</option>
      </select>

      <textarea id="rsvpUcapan" placeholder="Tuliskan ucapan & doa..." class="w-full bg-slate-900 border border-slate-700 text-xs rounded-xl p-3 text-slate-200 h-20"></textarea>

      <button type="submit" id="btnRsvp" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs py-2.5 rounded-xl transition">
        Kirim Konfirmasi
      </button>
    </form>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzil42IARd7zFttb8RtxWEJf7CrcZFtm-hDUJCHPr1GqImwa2Ogb0FqCCs-6gaA4q93Xw/exec";

    // MENGAMBIL PARAMETER NAMA TAMU DARI URL (?to=)
    const urlParams = new URLSearchParams(window.location.search);
    const namaTamu = urlParams.get('to');

    if (namaTamu) {
      document.getElementById('penerimaTamu').textContent = namaTamu;
    }

    // KIRIM RSVP KE APPS SCRIPT / GOOGLE SHEETS
    async function kirimRSVP(e) {
      e.preventDefault();
      const btn = document.getElementById('btnRsvp');
      btn.disabled = true;
      btn.textContent = "Sending...";

      const status = document.getElementById('rsvpStatus').value;
      const ucapan = document.getElementById('rsvpUcapan').value;
      const nama = namaTamu || "Tamu Undangan";

      try {
        const url = `${SCRIPT_URL}?action=rsvp&nama=${encodeURIComponent(nama)}&status=${encodeURIComponent(status)}&ucapan=${encodeURIComponent(ucapan)}`;
        await fetch(url, { method: 'POST', mode: 'no-cors' });
        alert('Terima kasih, konfirmasi Anda berhasil terkirim!');
        document.getElementById('rsvpForm').reset();
      } catch (err) {
        alert('Gagal mengirim konfirmasi.');
      } finally {
        btn.disabled = false;
        btn.textContent = "Kirim Konfirmasi";
      }
    }
  </script>
</body>
</html>
